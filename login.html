<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetroFlow - Emergency Dispatch Portal Login</title>
    <style>
        :root {
    --bg-deep: #101827;
    --panel-bg: #192538;
    --cyan-glow: #3695db;
    --blue-accent: #2878c7;
    --red-emergency: #e5484d;
    --text-primary: #f4f6f9;
    --text-secondary: #a4b0c0;
}

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-primary);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fullscreen Animated Canvas Simulation */
        #radar-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.7;
        }

        /* Top Header Navigation Overlay */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffffff, var(--cyan-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .beacon-icon {
            width: 14px;
            height: 14px;
            background-color: var(--red-emergency);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--red-emergency), 0 0 30px var(--red-emergency);
            animation: pulse-beacon 1.2s infinite alternate;
        }

        @keyframes pulse-beacon {
            0% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .system-status {
            font-size: 13px;
            color: var(--text-secondary);
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        /* Central Glassmorphism Login Container */
        .login-card {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 420px;

    background: hsl(233, 20%, 26%);
    border-radius: 10px;

    padding: 38px 34px;

    border: 1px solid #2c3b50;

    box-shadow: 0 15px 35px rgba(0,0,0,0.25);

    animation: fadeIn 0.5s ease-out;
}
            
        

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-card h2 {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .login-card p.subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 30px;
        }

        /* Interactive Form Elements */
        .input-group {
            margin-bottom: 22px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 13px 16px;
            background: rgba(6, 11, 19, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
.input-group input:focus,
.input-group select:focus {
    border-color: #3695db;
    box-shadow: 0 0 0 2px rgba(54,149,219,0.15);
    background: #101c2c;
}

        /* Modern Submit Button */
       .btn-login {
        .forgot-password {
    text-align: right;
    margin-top: -12px;
    margin-bottom: 18px;
}

.forgot-password a {
    color: #070707d2;
    font-size: 12px;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s ease;
}

.forgot-password a:hover {
    color: hwb(0 3% 97%);
    text-decoration: underline;
}
    width: 100%;
    padding: 13px;
    margin-top: 10px;

    background: #a24949;
    border: none;
    border-radius: 6px;

    color: white;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.4px;

    cursor: pointer;
    transition: background 0.2s ease;
}

.btn-login:hover {
    background: #2066aa;
}

.btn-login:active {
    transform: scale(0.99);
}

        /* Animated scanner light overlay inside the button */
        .btn-login::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                60deg,
                transparent,
                rgba(255, 255, 255, 0.25),
                transparent
            );
            transform: rotate(30deg);
            animation: shine 4s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(30deg); }
            20% { transform: translateX(100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }

        /* Footer Info inside card */
        .card-footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Animated Simulation Canvas (Radar Sweep & Network Nodes) -->
    <canvas id="radar-canvas"></canvas>

    <!-- Header Overlay -->
    <div class="top-bar">
        <div class="brand">
            <div class="beacon-icon"></div>
            MetroFlow Priority
        </div>
        <div class="system-status">
            SYSTEM STATUS: <span style="color: #00fe26;">ONLINE</span> | GPS NODE ACTIVE
        </div>
    </div>

    <!-- Login Box Container -->
    <div class="login-card">
        <h2>OPERATOR LOGIN</h2>
        <p class="subtitle">Ambulance Emergency Clearance System</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>Operator / Station Master ID</label>
                <input type="text" id="operatorId" placeholder="e.g., SM-NYC-908" required value="OFFICER-ALEX">
            </div>

            <div class="input-group">
                <label>Assigned Zone Sector</label>
                <select id="sectorSelect">
                    <option value="J4">Junction 4 Arterial (Central)</option>
                    <option value="J8">Junction 8 Highway Express</option>
                    <option value="J12">Junction 12 Medical Corridor</option>
                </select>
            </div>

            <div class="input-group">
                <label>Access Key / Password</label>
                <input type="password" id="accessKey" placeholder="••••••••••••" required value="masterpass123">
            </div>
            <div class="forgot-password">
                <a href="#" onclick="forgotPassword(event)">
                forgot password??
                 </a>
                 </div>
 
            <button type="submit" class="btn-login">
                Sign in 
            </button>
        </form>

        <div class="card-footer">
            Authorized personeel only.
        </div>
    </div>

    <!-- Background Simulation Script -->
     <script>
   function forgotPassword(event) {
    event.preventDefault();

    alert("Please contact your system administrator to reset your password.");
}

        // Redirect Logic: Navigates to your portal.html on submission
        function handleLogin(event) {
            event.preventDefault();
            const btn = document.querySelector('.btn-login');
            btn.innerHTML = "Authenticating GPS Node...";
            btn.style.opacity = "0.7";
            
            setTimeout(() => {
                window.location.href = 'portal.html';
            }, 800);
        }

        // --- Canvas Background Simulation: Tactical GPS Radar Sweep & Nodes ---
        const canvas = document.getElementById('radar-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Nodes representing ambulances & signals on a city map simulation
        const nodes = [];
        const nodeCount = 35;
        let sweepAngle = 0;

        for (let i = 0; i < nodeCount; i++) {
            nodes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 1.5,
                type: Math.random() > 0.75 ? 'ambulance' : 'signal',
                pulse: Math.random() * Math.PI
            });
        }

        function drawSimulation() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const maxRadius = Math.max(canvas.width, canvas.height) * 0.75;

            // 1. Draw Grid Lines
            ctx.strokeStyle = 'rgba(0, 242, 254, 0.04)';
            ctx.lineWidth = 1;
            const gridSize = 80;

            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // 2. Radar Concentric Rings
            ctx.strokeStyle = 'rgba(0, 242, 254, 0.08)';
            for (let r = 100; r < maxRadius; r += 150) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
                ctx.stroke();
            }

            // 3. Rotating Radar Sweep Beam
            sweepAngle += 0.008;
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, maxRadius, sweepAngle, sweepAngle + 0.35);
            ctx.lineTo(0, 0);
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, maxRadius);
            gradient.addColorStop(0, 'rgba(0, 242, 254, 0.15)');
            gradient.addColorStop(1, 'rgba(0, 242, 254, 0.0)');
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.restore();

            // 4. Draw Interactive Vehicle Nodes (Green/Red Pulse Points)
            nodes.forEach(node => {
                node.pulse += 0.03;
                const glow = Math.sin(node.pulse) * 3 + 4;

                ctx.beginPath();
                ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);

                if (node.type === 'ambulance') {
                    // Pulsing Red Emergency Marker
                    ctx.fillStyle = '#ff3366';
                    ctx.shadowColor = '#ff3366';
                    ctx.shadowBlur = glow * 2;
                } else {
                    // Cyan Network Traffic Signal Node
                    ctx.fillStyle = '#00f2fe';
                    ctx.shadowColor = '#00f2fe';
                    ctx.shadowBlur = glow;
                }
                ctx.fill();
                ctx.shadowBlur = 0; // Reset
            });

            requestAnimationFrame(drawSimulation);
        }

        drawSimulation();
    </script>
</body>
</html>
